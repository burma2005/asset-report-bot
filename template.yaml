AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Asset Portfolio Report Generator - Serverless Lambda

Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    Environment:
      Variables:
        OPENROUTER_API_KEY: !Ref OpenRouterKeyParam
        OPENROUTER_RACE_MODELS: !Ref OpenRouterRaceModelsParam
        OPENROUTER_MODELS: !Ref OpenRouterModelsParam
        GOOGLE_CLIENT_ID: !Ref GoogleClientIdParam
        ADMIN_EMAIL: !Ref AdminEmailParam
        USERS_TABLE: !Ref UsersTable

Parameters:
  GoogleClientIdParam:
    Type: String
    Description: Google OAuth 2.0 Client ID for ID token verification
  AdminEmailParam:
    Type: String
    Default: "burma2005@gmail.com"
    Description: Admin email (unlimited quota, paid backstop allowed)
  OpenRouterKeyParam:
    Type: String
    NoEcho: true
    Description: OpenRouter API key (sk-or-...) for free-model LLM calls
  OpenRouterRaceModelsParam:
    Type: String
    Default: "openai/gpt-oss-120b:free,google/gemma-4-31b-it:free"
    Description: Free models raced concurrently (first success wins)
  OpenRouterModelsParam:
    Type: String
    Default: "google/gemma-4-31b-it"
    Description: Paid backstop models (sequential) when the free race fails

Resources:

  # ── DynamoDB：用戶層級 + 額度 + 持倉快照 ──
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: asset-report-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # ── Lambda：接收 HTTP POST，抓價 + 產 HTML ──
  GenerateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: asset-report-generator
      CodeUri: src/generate_report/
      Handler: app.lambda_handler
      MemorySize: 512
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['*']
          AllowHeaders: [content-type, authorization]

Outputs:
  ReportEndpointUrl:
    Description: "貼入 index.html 的 Lambda 端點 URL"
    Value: !GetAtt GenerateReportFunctionUrl.FunctionUrl
  FunctionArn:
    Value: !GetAtt GenerateReportFunction.Arn
  UsersTableName:
    Value: !Ref UsersTable
