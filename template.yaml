AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Asset Portfolio Report Generator - Serverless Lambda

Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    Environment:
      Variables:
        OPENROUTER_API_KEY: !Ref OpenRouterKeyParam
        OPENROUTER_RACE_MODELS: !Ref OpenRouterRaceModelsParam
        OPENROUTER_MODELS: !Ref OpenRouterModelsParam
        API_KEY: !Ref ApiKeyParam

Parameters:
  ApiKeyParam:
    Type: String
    NoEcho: true
    Description: Shared secret for X-Api-Key header validation
  OpenRouterKeyParam:
    Type: String
    NoEcho: true
    Description: OpenRouter API key (sk-or-...) for free-model LLM calls
  OpenRouterRaceModelsParam:
    Type: String
    Default: "openai/gpt-oss-120b:free,google/gemma-4-31b-it:free"
    Description: Free models raced concurrently (first success wins)
  OpenRouterModelsParam:
    Type: String
    Default: "google/gemma-4-31b-it"
    Description: Paid backstop models (sequential) when the free race fails

Resources:

  # ── Lambda：接收 HTTP POST，抓價 + 產 HTML ──
  GenerateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: asset-report-generator
      CodeUri: src/generate_report/
      Handler: app.lambda_handler
      MemorySize: 512
      Timeout: 175
      # AI 改由 OpenRouter（HTTPS 外呼），不再需要 Bedrock IAM 權限
      # Lambda Function URL：無 API Gateway 30 秒限制，支援完整 120 秒執行
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          AllowMethods: ['*']
          AllowHeaders: [content-type, x-api-key]

Outputs:
  ReportEndpointUrl:
    Description: "貼入 index.html 的 Lambda 端點 URL"
    Value: !GetAtt GenerateReportFunctionUrl.FunctionUrl
  FunctionArn:
    Value: !GetAtt GenerateReportFunction.Arn
